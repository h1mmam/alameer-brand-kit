<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Alameer Reel</title>
<style>
@font-face{font-family:"AR";src:url("file:///System/Library/Fonts/SFArabicRounded.ttf");font-weight:100 900}
:root{--gold:#F4B300;--gold2:#FFD25E;--ink:#0B0B0C;--panel:#1B1B1B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:"AR","SF Arabic","Geeza Pro","Helvetica Neue",sans-serif;color:#fff;position:relative;direction:rtl}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
.abs{position:absolute}
.hide{display:none!important}

/* ---------- talking head ---------- */
#talk{position:absolute;inset:0;overflow:hidden;background:#000}
#tv{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 36%;filter:contrast(1.1) saturate(1.12) brightness(1.03)}
#tshade{position:absolute;inset:0;background:
  radial-gradient(120% 80% at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%),
  linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 62%,rgba(0,0,0,.7) 100%)}
#tflash{position:absolute;inset:0;background:#fff;opacity:0}

/* ---------- phone scene ---------- */
#pscene{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
#pbg{position:absolute;inset:0}
#glow1,#glow2{position:absolute;border-radius:50%;filter:blur(60px)}
#glow1{width:900px;height:900px;background:radial-gradient(circle,rgba(244,179,0,.34),transparent 65%)}
#glow2{width:800px;height:800px;background:radial-gradient(circle,rgba(255,140,0,.16),transparent 65%)}
#chev{position:absolute;left:-200px;top:0;width:1480px;height:2600px;opacity:.5}
.dot{position:absolute;border-radius:50%;background:var(--gold2)}
#camwrap{position:absolute;inset:0;perspective:2600px}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#phoneBox{position:absolute;left:208px;top:220px;width:664px;height:1337px;transform-origin:50% 50%}
#phone{position:absolute;inset:0;border-radius:72px;padding:12px;background:linear-gradient(145deg,#4a4a4a,#141414 45%,#2a2a2a);
  box-shadow:0 0 0 3px rgba(244,179,0,.7),0 60px 140px rgba(0,0,0,.85),0 0 160px rgba(244,179,0,.25)}
#screen{position:relative;width:640px;height:1313px;border-radius:60px;overflow:hidden;background:#000}
#sv{position:absolute;left:0;top:0;width:640px;height:1313px}
#island{position:absolute;top:12px;left:50%;width:142px;height:34px;margin-left:-71px;border-radius:20px;background:#000;z-index:5}
#hl{position:absolute;border:5px solid var(--gold);border-radius:24px;box-shadow:0 0 0 3000px rgba(0,0,0,.66),0 0 40px 6px rgba(244,179,0,.7),inset 0 0 24px rgba(244,179,0,.35);z-index:4}
#tap{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;z-index:6}
.ring{position:absolute;inset:0;border-radius:50%;border:6px solid #fff}
.tdot{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 30px rgba(255,255,255,.8)}
#dimmer{position:absolute;inset:0;background:#000;z-index:30;opacity:0}

/* header */
#hdr{position:absolute;left:0;right:0;top:112px;height:110px}
#hlogo{position:absolute;left:46px;top:6px;width:92px;height:92px;border-radius:50%;box-shadow:0 0 0 3px var(--gold),0 8px 30px rgba(0,0,0,.6)}
.step{position:absolute;right:46px;top:0;height:110px;display:flex;align-items:center;gap:20px}
.snum{width:84px;height:84px;border-radius:50%;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#111;font-weight:900;font-size:50px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(244,179,0,.45);flex:none}
.stx{display:flex;flex-direction:column;gap:2px}
.stt{font-size:60px;font-weight:900;line-height:1.1;text-shadow:0 4px 24px rgba(0,0,0,.8);white-space:nowrap}
.sts{font-size:32px;font-weight:600;color:var(--gold2);white-space:nowrap}
.sclip{overflow:hidden}

/* cards */
.card{position:absolute;display:flex;align-items:center;gap:26px;padding:26px 34px;border-radius:40px;
  background:linear-gradient(135deg,rgba(26,26,26,.88),rgba(10,10,10,.82));border:2.5px solid rgba(244,179,0,.65);
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 60px rgba(244,179,0,.18);backdrop-filter:blur(18px)}
.cic{width:104px;height:104px;border-radius:30px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;font-size:62px;flex:none;box-shadow:0 10px 30px rgba(244,179,0,.4)}
.ctt{font-size:58px;font-weight:900;line-height:1.12;white-space:nowrap}
.csb{font-size:34px;font-weight:600;color:var(--gold2);margin-top:4px;white-space:nowrap}
#badge{position:absolute;right:48px;top:140px;padding:16px 38px;border-radius:60px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#111;font-weight:900;font-size:50px;box-shadow:0 12px 40px rgba(244,179,0,.5);white-space:nowrap}
#tlogo{position:absolute;left:46px;top:128px;width:104px;height:104px;border-radius:50%;box-shadow:0 0 0 3px var(--gold),0 10px 34px rgba(0,0,0,.65)}
.stamp{position:absolute;display:flex;align-items:center;gap:20px;padding:16px 38px 16px 30px;border-radius:70px;background:rgba(14,14,14,.86);border:3px solid #ff4d4d;
  box-shadow:0 14px 44px rgba(0,0,0,.6),0 0 40px rgba(255,60,60,.28);font-size:54px;font-weight:900;white-space:nowrap}
.stamp .x{width:70px;height:70px;border-radius:50%;background:#ff3b3b;color:#fff;font-size:44px;display:flex;align-items:center;justify-content:center;flex:none}
.chip{position:absolute;display:flex;align-items:center;gap:18px;padding:20px 32px;border-radius:50px;background:rgba(18,18,18,.9);border:2.5px solid rgba(244,179,0,.7);font-size:44px;font-weight:800;white-space:nowrap;box-shadow:0 14px 44px rgba(0,0,0,.6)}
.chip b{color:var(--gold2)}

/* whatsapp mock */
#chat{position:absolute;left:140px;top:420px;width:800px;height:830px;border-radius:44px;overflow:hidden;background:#0b141a;box-shadow:0 50px 140px rgba(0,0,0,.85),0 0 0 3px rgba(37,211,102,.6),0 0 120px rgba(37,211,102,.25)}
#chead{height:130px;background:#1f2c34;display:flex;align-items:center;gap:22px;padding:0 30px}
#chead img.l{width:84px;height:84px;border-radius:50%}
#chead .n{font-size:40px;font-weight:800}
#chead .o{font-size:28px;color:#25d366;font-weight:600}
#chead img.w{width:60px;height:60px;margin-right:auto}
#cbody{position:absolute;top:130px;left:0;right:0;bottom:0;padding:22px 28px;display:flex;flex-direction:column;gap:16px;background:
  radial-gradient(circle at 20% 20%,rgba(37,211,102,.06),transparent 40%),#0b141a}
.bub{position:relative;max-width:640px;padding:16px 18px;border-radius:26px;font-size:38px;font-weight:700;line-height:1.35}
.out{align-self:flex-start;background:#005c4b;border-top-left-radius:6px}
.inn{align-self:flex-end;background:#202c33;border-top-right-radius:6px}
.bub img{display:block;width:520px;height:250px;object-fit:cover;border-radius:18px}
.bub .lbl{margin-top:10px;font-size:36px}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:8px 40px;font-size:36px}
.spec div{display:flex;gap:12px;align-items:center}
.spec i{font-style:normal;color:#25d366;font-weight:900}

/* captions */
#cap{position:absolute;left:50px;right:50px;top:1300px;height:190px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0 32px;z-index:100;direction:rtl}
#cap span{display:inline-block;font-weight:900;font-size:88px;line-height:1.2;color:#fff;transform-origin:50% 60%;
  text-shadow:0 0 0 #000,-6px -6px 0 rgba(0,0,0,.92),6px -6px 0 rgba(0,0,0,.92),-6px 6px 0 rgba(0,0,0,.92),6px 6px 0 rgba(0,0,0,.92),0 -7px 0 rgba(0,0,0,.92),0 7px 0 rgba(0,0,0,.92),-7px 0 0 rgba(0,0,0,.92),7px 0 0 rgba(0,0,0,.92),0 10px 30px rgba(0,0,0,.7)}
#cap span.on{color:#FFC21A}

/* transition panel */
#wipe{position:absolute;inset:0;z-index:90;pointer-events:none}
#wipe div{position:absolute;inset:0}
#wp{background:#0b0b0c}
#ws1{background:linear-gradient(90deg,#FFD25E,#F4B300)}
#ws2{background:rgba(244,179,0,.55)}
#wlogo{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;box-shadow:0 0 0 4px var(--gold),0 0 80px rgba(244,179,0,.5)}

/* end card */
#end{position:absolute;inset:0;overflow:hidden}
#elogo{position:absolute;left:340px;top:300px;width:400px;height:400px;border-radius:50%}
#ering{position:absolute;left:310px;top:270px;width:460px;height:460px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 55%,var(--gold) 80%,var(--gold2) 100%);
  -webkit-mask:radial-gradient(circle,transparent 205px,#000 207px,#000 224px,transparent 226px)}
#eshine{position:absolute;left:340px;top:300px;width:400px;height:400px;border-radius:50%;overflow:hidden}
#eshine i{position:absolute;top:-40px;left:0;width:90px;height:480px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
.etxt{position:absolute;left:40px;right:40px;text-align:center;font-weight:900}
#cta{position:absolute;left:150px;right:150px;top:1090px;height:140px;border-radius:80px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#111;font-size:66px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:22px;box-shadow:0 20px 70px rgba(244,179,0,.55),0 0 0 0 rgba(244,179,0,.6)}
#cta .ar{display:inline-block}

/* badges */
.sb{position:absolute;height:130px;border-radius:26px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 40px rgba(244,179,0,.25)}
.sb img{display:block;height:100%}
#sbA{background:#000;border:3px solid #fff;border-radius:26px}
#sbA img{height:150%;margin:-17.5px -6%;width:112%}
#sbG img{height:auto;width:488px;margin:-10px 0 0 -25px;max-width:none}
#sbG{background:transparent;border-radius:65px}
</style>
</head>
<body>
<div id="stage">

  <!-- phone scene -->
  <div id="pscene" class="hide">
    <div id="pbg">
      <div id="glow1"></div><div id="glow2"></div>
      <svg id="chev" viewBox="0 0 1480 2600" fill="none">
        <g stroke="#F4B300" stroke-width="26" stroke-linejoin="miter" opacity=".9">
          <polyline points="-100,900 640,160 1380,900"/><polyline points="-100,1180 640,440 1380,1180" opacity=".55"/>
          <polyline points="-100,1460 640,720 1380,1460" opacity=".3"/>
          <polyline points="-100,1740 640,1000 1380,1740" opacity=".16"/>
        </g>
      </svg>
      <div id="dots"></div>
    </div>
    <div id="camwrap"><div id="cam">
      <div id="phoneBox"><div id="phone"><div id="screen">
        <img id="sv"><div id="island"></div>
        <div id="hl" class="hide"></div>
        <div id="tap" class="hide"><div class="ring"></div><div class="ring"></div><div class="tdot"></div></div>
      </div></div></div>
    </div></div>
    <div id="dimmer"></div>

    <div id="hdr">
      <img id="hlogo" src="assets/logo.png">
      <div id="steps"></div>
    </div>

    <div id="chips"></div>
    <div id="chat" class="hide">
      <div id="chead"><img class="l" src="assets/logo.png"><div><div class="n">الأمير للمعدات</div><div class="o">متصل الآن</div></div><img class="w" src="assets/whatsapp.png"></div>
      <div id="cbody">
        <div class="bub out hide" id="b1"><img src="assets/machine.jpg"><div class="lbl">📷 صورة الآلية</div></div>
        <div class="bub out hide" id="b2"><div class="spec"><div><i>✓</i> الموديل</div><div><i>✓</i> الحالة</div><div><i>✓</i> ساعات العمل</div><div><i>✓</i> السعر</div></div></div>
        <div class="bub inn hide" id="b3">✅ تم! بنعرضها للبيع على التطبيق</div>
      </div>
    </div>
    <div id="stamps2"></div>
    <div id="sbA" class="sb hide"><img src="assets/appstoelogo.jpg"></div>

    <div id="linkchip" class="chip hide">🔗 الرابط <b>بالوصف</b> 👇</div>
  </div>

  <!-- talking head -->
  <div id="talk">
    <img id="tv">
    <div id="tshade"></div>
    <div id="tflash"></div>
    <img id="tlogo" src="assets/logo.png">
    <div id="badge">🔥 ميزة جديدة</div>
    <div id="tcards"></div>
  </div>

  <!-- end card -->
  <div id="end" class="hide">
    <div id="ering"></div>
    <img id="elogo" src="assets/logo.png">
    <div id="eshine"><i></i></div>
    <div class="etxt" id="e1" style="top:770px;font-size:104px;color:var(--gold2)">شركة الأمير</div>
    <div class="etxt" id="e2" style="top:900px;font-size:58px">للمعدات وقطع الغيار</div>
    <div class="etxt" id="e3" style="top:1000px;font-size:42px;color:#cfcfcf;font-weight:700">ثقتكم فينا.. ودافعنا دايماً نقدّم لكم الأفضل</div>
    <div id="cta"><span class="ar">⬇</span><span>حمّل التطبيق الآن</span></div>
    <div class="etxt" id="e4" style="top:1252px;font-size:46px;font-weight:800">الرابط <span style="color:var(--gold2)">بالوصف</span> 👇</div>
  </div>

  <div id="cap"></div>

  <div id="wipe"><div id="wp"></div><div id="ws2"></div><div id="ws1"></div><img id="wlogo" src="assets/logo.png"></div>
</div>

<script>
/* ================= helpers ================= */
const W=1080,H=1920,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const E={
  lin:x=>x, out2:x=>1-(1-x)*(1-x), out3:x=>1-Math.pow(1-x,3), out5:x=>1-Math.pow(1-x,5),
  inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  in3:x=>x*x*x,
  back:x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  elastic:x=>x===0?0:x===1?1:Math.pow(2,-9*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1
};
const $=id=>document.getElementById(id);
function rng(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
const FR='file://'+(window.FRAMES_DIR||'');
window.COUNTS=window.COUNTS||{c1:537,c2:144,c3:640,c4:930,c5:304};
const pad=n=>String(n).padStart(4,'0');
async function setFrame(img,clip,local){
  const i=clamp(Math.round(local*FPS)+1,1,COUNTS[clip]);
  const src=`${FR}/${clip}/${pad(i)}.jpg`;
  if(img.dataset.s!==src){img.dataset.s=src;img.src=src;try{await img.decode()}catch(e){}}
}

/* ================= timeline ================= */
const T={c1:[0,17.7],c2:[17.7,22.4],c3:[22.4,43.8],c4:[43.8,74.7],c5:[74.7,84.9]};
const END=86.5, SW1=22.4, SW2=80.1;      // scene swaps (hidden under wipes)
const C4OFF=43.8-0.2;                    // clip4 local -> global (clip4 trimmed from 0.2)

/* captions: [start,end,text] in clip-local seconds */
const CAP={
 c1:[[0,1.7,'يعطيكم العافية جميعاً'],[1.72,3.5,'اليوم وفّرنا لكم خاصية'],[3.58,4.2,'جديدة ومميزة'],[4.24,5.7,'داخل تطبيق محلات الأمير'],
     [5.72,7.1,'هاي الخاصية بتساعدك'],[7.14,8.6,'إنك تعرض آليتك للبيع'],[8.66,9.9,'وكمان تتصفح وتشوف'],[9.98,11.95,'شو فيه آليات معروضة للبيع'],
     [12.0,13.6,'وهاي الخدمة'],[13.74,14.8,'بدون أي وسطاء'],[14.84,16.2,'وبدون أي عمولات'],[16.28,17.7,'من راسك لراس الزبون']],
 c2:[[0,1.1,'خليكم معنا'],[1.1,2.7,'لنشرح لكم داخل التطبيق'],[2.72,4.7,'كيف تستفيدوا من الميزة الجديدة']],
 c3:[[0,1.3,'وهسا خلينا نفرجيكم'],[1.32,3.1,'كيف تستخدموا الميزة الجديدة'],[3.12,4.1,'من داخل تطبيق الأمير'],[4.2,5.6,'أول ما تفتح التطبيق'],
     [5.68,6.6,'ومن الصفحة الرئيسية'],[6.66,7.3,'زي ما انتو شايفين'],[7.36,8.5,'عندنا هون'],[8.58,9.8,'فيه زر اعرض آليتك'],
     [9.82,11.2,'إذا عندك أي آلية'],[11.24,12.5,'أو أي معدة حاب تبيعها'],[12.62,13.15,'كل اللي عليك'],[13.18,14.0,'تكبس على هذا الزر'],
     [14.04,15.4,'وبحولك مباشر على واتساب'],[15.52,17.0,'تبعث لنا صورة الآلية'],[17.14,19.3,'وجميع تفاصيلها ومواصفاتها'],
     [19.34,20.0,'واحنا بنساعدك'],[20.06,21.4,'بعرضها للبيع على التطبيق']],
 c4:[[0.3,1.5,'وكمان عندنا هون'],[1.52,2.6,'زر طلب المساعدة'],[2.64,3.7,'إذا عندك أي استفسار'],[3.74,4.7,'أو احتجت أي مساعدة'],
     [4.82,5.6,'بتقدر تكبس عليه'],[5.6,6.7,'وتتواصل معنا مباشر'],[6.74,8.0,'احنا جاهزين نساعدك'],[8.38,10.9,'قسم المعدات المعروضة للبيع'],
     [11.12,12.7,'تكبس على زر جميع المعدات'],[12.72,14.3,'بتشوف كل المعدات المعروضة'],[14.38,15.6,'داخل التطبيق'],
     [15.82,17.0,'تقدر تتصفح المعدات'],[17.0,18.4,'تدخل على أي آلية بتعجبك'],[18.5,20.1,'وتشوفوا صور ومواصفاتها'],
     [20.2,22.0,'وجميع تفاصيلها الخاصة فيها'],[22.06,23.05,'وإذا عجبتك الآلية'],[23.1,24.1,'حاب تستفسر عنها'],[24.14,24.7,'أو تشتريها'],
     [24.74,25.6,'كل اللي عليك'],[25.62,27.3,'تكبس أرسل على الواتساب'],[27.36,28.3,'وتتواصل مباشر'],[28.38,29.3,'مع صاحب الآلية'],
     [29.32,30.0,'بدون أي وسيط'],[30.06,31.0,'وبدون أي عمولات']],
 c5:[[0,1.2,'لسه ما حملت التطبيق؟'],[1.24,3.6,'بتقدر تحمّله على الآيفون والأندرويد'],[3.74,5.4,'من خلال الرابط الموجود بالوصف'],
     [5.44,7.2,'شركة الأمير للمعدات وقطع الغيار'],[7.22,8.8,'ثقتكم فينا ودافعنا دايماً'],[8.84,10.2,'نقدّم لكم الأفضل']]
};
const OFF={c1:0,c2:17.7,c3:22.4,c4:C4OFF,c5:74.7};
const PHR=[];
for(const k in CAP)for(const [a,b,tx] of CAP[k]){
  const ws=tx.split(' '),len=ws.map(w=>w.length+1),tot=len.reduce((x,y)=>x+y,0);
  let c=0;const words=ws.map((w,i)=>{const s=a+OFF[k]+(b-a)*c/tot;c+=len[i];return{w,s}});
  PHR.push({a:a+OFF[k],b:b+OFF[k]+.12,words});
}
PHR.sort((x,y)=>x.a-y.a);
PHR.forEach(p=>{const d=document.createElement('div');d.style.display='contents';p.el=d;
  p.sp=p.words.map(o=>{const s=document.createElement('span');s.textContent=o.w;d.appendChild(s);return s})});
const capEl=$('cap');let capCur=null;
function updCaps(t){
  let cur=null;for(const p of PHR){if(t>=p.a&&t<p.b){cur=p;break}}
  if(cur!==capCur){capEl.replaceChildren();if(cur)capEl.appendChild(cur.el);capCur=cur}
  if(!cur){return}
  const pin=E.out3(P(t,cur.a,cur.a+.14));
  capEl.style.transform=`translateY(${(1-pin)*22}px) scale(${.9+.1*pin})`;
  capEl.style.opacity=clamp(pin*1.4)*(1-P(t,cur.b-.06,cur.b));
  cur.words.forEach((o,i)=>{
    const s=cur.sp[i],on=t>=o.s;
    s.className=on?'on':'';
    const pu=on?Math.max(0,1-(t-o.s)/.22):0;
    s.style.transform=`scale(${1+.16*E.out2(pu)})`;
  });
}

/* ================= generic timed element ================= */
function anim(el,t,t0,t1,kind,{inD=.5,outD=.3,x=0,y=0,rot=0}={}){
  if(t<t0||t>t1+outD){el.classList.add('hide');return false}
  el.classList.remove('hide');
  const pi=P(t,t0,t0+inD),po=P(t,t1,t1+outD);
  let tx=0,ty=0,sc=1,r=0,op=1;
  if(kind==='right'){const e=E.out5(pi);tx=(1-e)*520;op=clamp(pi*3)}
  else if(kind==='left'){const e=E.out5(pi);tx=-(1-e)*520;op=clamp(pi*3)}
  else if(kind==='up'){const e=E.out5(pi);ty=(1-e)*240;op=clamp(pi*3)}
  else if(kind==='pop'){const e=E.back(pi);sc=.3+.7*e;op=clamp(pi*4)}
  else if(kind==='slam'){const e=E.out5(pi);sc=2.4-1.4*e;r=rot*(1-e)*2+rot*.4;op=clamp(pi*5)}
  else if(kind==='fade'){op=pi}
  const eo=E.in3(po);
  op*=1-eo;
  if(po>0){if(kind==='right')tx+=eo*-120;else if(kind==='left')tx+=eo*120;else ty+=-eo*60;sc*=1-.08*eo}
  el.style.opacity=op;
  el.style.transform=`translate(${tx+x}px,${ty+y}px) scale(${sc}) rotate(${r}deg)`;
  return true;
}

/* ================= camera keys (phone scene) [t, scale, fx, fy, ty] ================= */
const BY=.615;
const CAM=[
 [22.4,1,.5,.5,0],[26.5,1,.5,.5,0],[30.0,1.06,.5,.5,0],
 [30.4,1.06,.5,.5,0],[31.4,1.85,.2,BY,0],[36.7,1.85,.2,BY,0],[37.6,1,.5,.5,0],
 [43.4,1,.5,.5,0],[44.4,1.85,.5,BY,0],[47.0,1.85,.5,BY,0],[48.0,1.0,.5,.5,0],[51.4,1,.5,.5,0],
 [52.6,1.8,.8,BY,0],[56.9,1.8,.8,BY,0],[57.7,1.0,.5,.5,0],[58.0,1.0,.5,.45,0],[62.3,1.12,.5,.45,0],
 [62.8,1.0,.5,.5,0],[66.8,1.04,.5,.5,0],[67.8,1.75,.5,.552,0],[71.6,1.75,.5,.552,0],[72.6,1.0,.5,.5,0],[74.7,1.0,.5,.5,0],
 [75.8,.8,.5,.5,150],[79.7,.82,.5,.5,150],[80.2,.9,.5,.5,150]
];
function camAt(t){
  if(t<=CAM[0][0])return CAM[0];
  for(let i=0;i<CAM.length-1;i++){const a=CAM[i],b=CAM[i+1];
    if(t<=b[0]){const e=E.inOut(P(t,a[0],b[0]));return[t,lerp(a[1],b[1],e),lerp(a[2],b[2],e),lerp(a[3],b[3],e),lerp(a[4],b[4],e)]}}
  return CAM[CAM.length-1];
}
/* highlight rects in screen px (640x1313): [t0,t1,fx,fy,fw,fh] */
const SW=640,SH=1313;
const HL=[
 [30.9,36.5,.18,BY,.31,.056],

/* ================= wipes ================= */
const K=260,WP=1900,TRAVEL=W+WP+2*K+4;
const pSwap=((W+K)+(WP-W-K)/2+K+2)/TRAVEL;
function wipe(t,tc,dur){          // swap instant = tc
  const t0=tc-pSwap*dur,p=(t-t0)/dur;
  const w=$('wipe');
  if(p<=0||p>=1){w.style.display='none';return false}
  w.style.display='block';
  const ld=lerp(-K-2,W+WP+K+2,p),tr=ld-WP;
  const poly=(a,b)=>`polygon(${a+K}px 0,${b+K}px 0,${b}px ${H}px,${a}px ${H}px)`;
  $('wp').style.clipPath=poly(tr,ld);
  $('ws1').style.clipPath=poly(ld-90,ld+14);
  $('ws2').style.clipPath=poly(tr-14,tr+40);
  const cover=1-clamp(Math.abs(p-pSwap)/.14);
  const lg=$('wlogo');lg.style.opacity=E.out2(cover);lg.style.transform=`scale(${.6+.5*E.out3(cover)}) rotate(${(p-pSwap)*40}deg)`;
  return true;
}
function wipeFrom(t,dur,startP){   // intro: begin already part-way revealed
  const p=startP+(1-startP)*clamp(t/dur);const w=$('wipe');
  if(p>=1){w.style.display='none';return}
  w.style.display='block';
  const ld=lerp(-K-2,W+WP+K+2,p),tr=ld-WP;
  const poly=(a,b)=>`polygon(${a+K}px 0,${b+K}px 0,${b}px ${H}px,${a}px ${H}px)`;
  $('wp').style.clipPath=poly(tr,ld);$('ws1').style.clipPath=poly(ld-90,ld+14);$('ws2').style.clipPath=poly(tr-14,tr+40);
  const lg=$('wlogo');const cover=1-clamp(Math.abs(p-pSwap)/.14);lg.style.opacity=E.out2(cover)*clamp(1-t/dur*1.2+.2);lg.style.transform=`scale(${.6+.5*E.out3(cover)})`;
}

/* ================= talking-head zoom keys ================= */
const ZK=[ [0,2.9,1.04,1.10],[3.0,8.6,1.18,1.25],[8.66,11.95,1.06,1.12],[12.0,17.7,1.20,1.30],
           [17.7,20.4,1.02,1.09],[20.4,22.5,1.16,1.23] ];
function zoomAt(t){for(const [a,b,s0,s1] of ZK)if(t>=a&&t<b){return lerp(s0,s1,E.out2(P(t,a,b)))}return 1.1}

/* ================= main seek ================= */
async function seek(t){
  const inTalk=t<SW1, inEnd=t>=SW2;
  $('talk').classList.toggle('hide',!inTalk);
  $('pscene').classList.toggle('hide',inTalk||inEnd);
  $('end').classList.toggle('hide',!inEnd);
  ['camwrap','hdr','chips','stamps2','dimmer'].forEach(i=>$(i).classList.remove('hide'));

  /* ---- talking head ---- */
  if(inTalk){
    const clip=t<T.c2[0]?'c1':'c2';
    const loc=clip==='c1'?t:t-T.c2[0];
    await setFrame($('tv'),clip,loc);
    const z=zoomAt(t);
    $('tv').style.transform=`scale(${z}) translateY(${Math.sin(t*1.3)*-4}px)`;
    // whip flash on c1->c2 cut
    const fp=P(t,17.7,17.9);$('tflash').style.opacity=t>=17.7?(1-fp)*.55:0;
    anim(badgeEl,t,.55,5.5,'pop',{inD:.5});
    $('tlogo').style.opacity=clamp(P(t,.4,.8));
    kw.forEach(k=>anim(k.el,t,k.t0,k.t1,'right'));
    anim(st1,t,13.74,17.7,'slam',{inD:.4,rot:-4});
    anim(st2,t,14.84,17.7,'slam',{inD:.4,rot:3});
    anim(st3,t,16.3,17.7,'pop',{inD:.45});
  }

  /* ---- phone scene ---- */
  if(!inTalk&&!inEnd){
    // bg
    const g1=$('glow1'),g2=$('glow2');
    g1.style.transform=`translate(${300+Math.sin(t*.6)*120}px,${300+Math.cos(t*.5)*160}px)`;
    g2.style.transform=`translate(${-100+Math.cos(t*.4)*140}px,${1050+Math.sin(t*.7)*120}px)`;
    $('chev').style.transform=`translateY(${-((t*22)%260)}px)`;
    DOTS.forEach(d=>{const y=((d.y-t*d.v)%H+H)%H;d.e.style.left=d.x+'px';d.e.style.top=y+'px';d.e.style.opacity=d.o*(.6+.4*Math.sin(t*2+d.ph))});
    // frame
    let clip,loc;
    if(t<T.c4[0]){clip='c3';loc=t-T.c3[0]}
    else if(t<T.c5[0]){clip='c4';loc=t-C4OFF}
    else{clip='c5';loc=t-T.c5[0]}
    await setFrame($('sv'),clip,loc);
    // camera
    const [,s,fx,fy,ty]=camAt(t);
    const cx=220+SW*fx,cy=232+SH*fy;
    $('cam').style.transform=`translate(${540-s*cx}px,${888+ty-s*cy}px) scale(${s})`;
    // phone intro + tilt
    const pi=P(t,22.5,23.5),e=E.back(pi);
    const tilt=Math.sin(t*.7)*3;
    const ty0=(1-e)*620,rx=(1-E.out3(pi))*28;
    $('phoneBox').style.transform=`translateY(${ty0}px) rotateX(${rx}deg) rotateY(${tilt}deg)`;
    $('phoneBox').style.opacity=clamp(pi*3);
    // highlight
    const hl=$('hl');let hlOn=false;
    for(const [a,b,fx2,fy2,fw,fh] of HL){
      if(t>=a-.05&&t<=b+.3){
        const pin=E.out3(P(t,a,a+.5)),pout=P(t,b,b+.3);
        const w=fw*SW,h=fh*SH,pul=1+.025*Math.sin(t*9);
        const grow=lerp(1.5,1,pin);
        hl.style.width=w*grow*pul+'px';hl.style.height=h*grow*pul+'px';
        hl.style.left=fx2*SW-w*grow*pul/2+'px';hl.style.top=fy2*SH-h*grow*pul/2+'px';
        hl.style.opacity=clamp(pin*1.5)*(1-pout);hlOn=true;
        hl.style.boxShadow=`0 0 0 3000px rgba(0,0,0,${.66*pin}),0 0 40px 6px rgba(244,179,0,.7),inset 0 0 24px rgba(244,179,0,.35)`;
        hl.style.borderColor=`rgba(244,179,0,${.75+.25*Math.sin(t*9)})`;
      }
    }
    hl.classList.toggle('hide',!hlOn);
    // taps
    const tp=$('tap');let tOn=false;
    for(const [tt,fx2,fy2] of TAPS){
      const d=t-tt;
      if(d>-.12&&d<.8){
        tOn=true;tp.style.left=fx2*SW+'px';tp.style.top=fy2*SH+'px';
        const press=P(d,-.12,0),rel=P(d,0,.6);
        const rings=tp.querySelectorAll('.ring'),dot=tp.querySelector('.tdot');
        dot.style.transform=`scale(${lerp(1.4,.85,press)*lerp(1,1.5,E.out2(rel))})`;dot.style.opacity=(1-rel)*clamp(press*2);
        rings.forEach((r,i)=>{const q=P(d,i*.12,.6+i*.12);r.style.transform=`scale(${.3+1.5*E.out3(q)})`;r.style.opacity=d<0?0:(1-q)*.9});
      }
    }
    tp.classList.toggle('hide',!tOn);

    // dim phone while overlays (chat / stamps)
    let dim=0;
    dim=Math.max(dim,E.out3(P(t,36.8,37.4))*(1-P(t,43.2,43.8)));
    dim=Math.max(dim,E.out3(P(t,72.0,72.5))*(1-P(t,74.6,75.1))*.85);
    $('camwrap').style.filter=`brightness(${1-.62*dim}) blur(${dim*7}px)`;
    // header steps
    STEPS.forEach(s=>{
      const a=s[0],b=s[1];
      const vis=t>=a-.01&&t<b+.15;
      s.el.style.display=vis?'flex':'none';
      if(vis){
        const pi2=E.out5(P(t,a+.08,a+.55)),po2=E.in3(P(t,b-.12,b+.1));
        const first=s===STEPS[0];
        const fade=(first&&t<23.2)?P(t,22.6,23.2):1;
        s.el.style.opacity=pi2*(1-po2)*fade;
        s.el.style.transform=`translateY(${(1-pi2)*50-po2*40}px)`;
        const n=s.el.querySelector('.snum');
        n.style.transform=`scale(${E.back(P(t,a,a+.45))}) rotate(${(1-E.out3(P(t,a,a+.5)))*-120}deg)`;
      }
    });
    $('hlogo').style.opacity=clamp(P(t,22.7,23.2));
    // chips
    anim(chipSell,t,34.0,36.9,'right',{inD:.5});
    anim(chipHelp,t,46.8,51.6,'left',{inD:.5});
    anim(chipAll,t,57.0,59.4,'left',{inD:.5});
    anim(chipWA,t,68.6,71.9,'right',{inD:.5});
    // whatsapp chat
    const chat=$('chat');
    const on=anim(chat,t,36.9,43.5,'pop',{inD:.55,outD:.35,y:0});
    if(on){
      anim($('b1'),t,38.0,43.5,'up',{inD:.45,outD:.01});
      anim($('b2'),t,39.7,43.5,'up',{inD:.45,outD:.01});
      anim($('b3'),t,41.9,43.5,'up',{inD:.45,outD:.01});
      ['b1','b2','b3'].forEach(i=>{const e=$(i);e.style.opacity=e.style.opacity});
    }
    // stamps over phone
    anim(stampP1,t,72.2,74.7,'slam',{inD:.4,rot:-4});
    anim(stampP2,t,72.9,74.7,'slam',{inD:.4,rot:3});
    // store badges & link
    const sa=$('sbA'),sg=$('sbG');
    anim(sa,t,76.0,79.8,'pop',{inD:.55,x:0});
    anim(sg,t,77.2,79.8,'pop',{inD:.55,x:0});
    sa.style.left='60px';sa.style.top='246px';sa.style.width='450px';
    sg.style.left='570px';sg.style.top='246px';sg.style.width='450px';
    anim($('linkchip'),t,78.4,79.8,'up',{inD:.5});
    $('linkchip').style.left='210px';$('linkchip').style.top='410px';
  }

  /* ---- end card ---- */
  if(inEnd){
    const te=t-SW2;
    $('pscene').classList.remove('hide');   // reuse animated background
    $('talk').classList.add('hide');
    const g1=$('glow1'),g2=$('glow2');
    g1.style.transform=`translate(${180+Math.sin(t*.6)*100}px,${160+Math.cos(t*.5)*120}px)`;
    g2.style.transform=`translate(${100+Math.cos(t*.4)*140}px,${900+Math.sin(t*.7)*120}px)`;
    $('chev').style.transform=`translateY(${-((t*22)%260)}px)`;
    DOTS.forEach(d=>{const y=((d.y-t*d.v)%H+H)%H;d.e.style.left=d.x+'px';d.e.style.top=y+'px';d.e.style.opacity=d.o*(.6+.4*Math.sin(t*2+d.ph))});
    ['camwrap','hdr','chips','chat','stamps2','sbA','sbG','linkchip','dimmer'].forEach(i=>$(i).classList.add('hide'));
    const lp=E.elastic(P(te,.25,1.1));
    const lg=$('elogo'),rg=$('ering'),sh=$('eshine');
    lg.style.transform=`scale(${.2+.8*lp})`;lg.style.opacity=clamp(P(te,.25,.5));
    rg.style.transform=`scale(${.4+.6*E.out3(P(te,.3,1.0))}) rotate(${te*70}deg)`;rg.style.opacity=clamp(P(te,.3,.7));
    sh.style.transform=`scale(${.2+.8*lp})`;
    sh.firstElementChild.style.transform=`translateX(${lerp(-120,520,P(te,1.2,2.0))}px) skewX(-18deg)`;
    const rise=(id,a,d=.55)=>{const el=$(id),p=E.out5(P(te,a,a+d));el.style.opacity=clamp(p*1.5);el.style.transform=`translateY(${(1-p)*70}px)`};
    rise('e1',1.0);rise('e2',1.3);rise('e3',1.9);
    const cp=E.back(P(te,2.4,3.0));
    const cta=$('cta');cta.style.opacity=clamp(P(te,2.4,2.7));
    const pulse=te>3.0?1+.04*Math.sin((te-3)*6):1;
    cta.style.transform=`scale(${(.4+.6*cp)*pulse})`;
    cta.style.boxShadow=`0 20px 70px rgba(244,179,0,.55),0 0 0 ${te>3?((te-3)*40)%40:0}px rgba(244,179,0,${te>3?1-(((te-3)*40)%40)/40:0})`;
    cta.firstElementChild.style.transform=`translateY(${Math.sin(te*7)*8}px)`;
    rise('e4',3.2);
  }

  updCaps(t);

  /* ---- wipes ---- */
  if(t<1.2)wipeFrom(t,.8,pSwap+.3);
  else if(!wipe(t,SW1,.9)) wipe(t,SW2,.9);
}
window.seek=seek;
